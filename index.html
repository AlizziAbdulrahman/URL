<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>iMessage Style (Gray Only, Compact Version)</title>
<style>
  body {
    margin: 0;
    background: #f9f9fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  .header {
    background: #f2f2f7;
    border-bottom: 1px solid #e5e5ea;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .back {
    font-size: 16px;
    color: #007aff;
    cursor: pointer;
    font-weight: 500;
  }
  .contact {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #d1d1d6;
  }
  .name {
    font-weight: 700;
    font-size: 18px;
  }

  /* Chat area */
  .chat {
    flex: 1;
    background: #fff;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }

  /* Message bubble */
  .bubble {
    background: #e5e5ea;
    color: #000;
    padding: 8px 12px;
    border-radius: 14px;
    border-top-left-radius: 4px;
    max-width: 80%;
    align-self: flex-start;
    margin-bottom: 8px;
    line-height: 1.4;
    font-size: 17px;
    position: relative;
  }

  /* Tail */
  .bubble::after {
    content: "";
    position: absolute;
    left: -4px;
    bottom: 0;
    width: 8px;
    height: 8px;
    background: #e5e5ea;
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }

  /* Input area */
  .input-bar {
    background: #f2f2f7;
    padding: 8px 10px;
    border-top: 1px solid #e5e5ea;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .text-box {
    flex: 1;
    border: none;
    background: #fff;
    border-radius: 18px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
  }
  .send-btn {
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
  }
  a {
    color: #007aff;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="back">‹</div>
    <div class="contact">
      <div class="avatar"></div>
      <div class="name">Ezextra</div>
    </div>
  </div>

  <div class="chat">
     <div class="bubble">
      عزيزي الطالب، استفد من خصوماتك الحصرية على الاجهزة والطابعات اغتنم الفرصة وأطلب الآن، اضغط هنا:
      <br>
      <a href="https://lora-reconciliatory-jacinto.ngrok-free.dev" target="_blank">https://lora-reconciliatory-jacinto.ngrok-free.dev</a>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" class="text-box" placeholder="iMessage" disabled>
    <button class="send-btn">↑</button>
  </div>

</body>
</html>
